name: Build verified NeuroGuard archive

on:
  pull_request:
    paths:
      - ".github/workflows/release-package.yml"
      - "make_notebook.py"
      - "neuroguard_core.py"
      - "train.py"
      - "inference.py"
      - "api.py"
      - "prediction_research.py"
      - "NeuroGuard_AI_Final.ipynb"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v
      - name: Build allowlisted archive and verify contents and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          allowed = [
              "README.md",
              "TECHNICAL_REVIEW.md",
              "api.py",
              "inference.py",
              "integration_guide.md",
              "make_notebook.py",
              "neuroguard_core.py",
              "prediction_research.py",
              "requirements.txt",
              "train.py",
              "NeuroGuard_AI_Final.ipynb",
              "tests/test_api.py",
              "tests/test_core_labels.py",
              "tests/test_core_split.py",
              "tests/test_inference_api.py",
              "tests/test_notebook_contract.py",
              "tests/test_partial_dataset_training_gate.py",
              "tests/test_prediction_research.py",
              "tests/test_train_metrics.py",
              "tests/test_training_metrics.py",
          ]
          missing = [name for name in allowed if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Required release files missing: {missing}")
          tracked = set(subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines())
          forbidden_tracked = sorted(
              name for name in tracked
              if name.lower().endswith((".zip", ".exe", ".dll", ".so", ".bin"))
          )
          if forbidden_tracked:
              print("Excluded non-release tracked files:", forbidden_tracked)
          archive = pathlib.Path("dist/NeuroGuard_Verified.zip")
          hashes = []
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in sorted(allowed):
                  data = (root / name).read_bytes()
                  z.writestr("NeuroGuard_Final/" + name, data)
                  hashes.append(f"{hashlib.sha256(data).hexdigest()}  {name}")
              z.writestr("NeuroGuard_Final/SOURCE_COMMIT.txt", commit + "\n")
              z.writestr("NeuroGuard_Final/SHA256SUMS.txt", "\n".join(hashes) + "\n")
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity check failed: {bad}")
              names = z.namelist()
              expected = sorted("NeuroGuard_Final/" + name for name in allowed) + [
                  "NeuroGuard_Final/SHA256SUMS.txt", "NeuroGuard_Final/SOURCE_COMMIT.txt"
              ]
              if sorted(names) != sorted(expected):
                  raise SystemExit(f"Archive file list mismatch: {sorted(names)}")
              if any(name.lower().endswith((".zip", ".exe", ".dll", ".so", ".bin")) for name in names):
                  raise SystemExit("Archive contains a nested archive or executable/binary")
              sums = z.read("NeuroGuard_Final/SHA256SUMS.txt").decode().splitlines()
              for line in sums:
                  digest, name = line.split("  ", 1)
                  actual = hashlib.sha256(z.read("NeuroGuard_Final/" + name)).hexdigest()
                  if actual != digest:
                      raise SystemExit(f"Checksum mismatch: {name}")
          print(f"Built {archive} from {commit}; {len(allowed)} allowlisted files; checksums verified.")
          PY
      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: NeuroGuard-Verified-${{ github.sha }}
          path: dist/NeuroGuard_Verified.zip
          if-no-files-found: error
          retention-days: 30
